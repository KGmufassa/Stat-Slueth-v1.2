<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sports Statistical LLM - Statistics-first research interface for sports data analysis">
    <title>Stat Sleuths - Sports Statistical Research</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" fill="currentColor"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                </svg>
                <h1 class="logo-text">Stat Sleuths</h1>
            </div>
            
            <nav class="main-nav">
                <a href="#query" class="nav-link active" data-page="query">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    Query
                </a>
                <a href="#compare" class="nav-link" data-page="compare">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <path d="M14 14h7v7h-7z"></path>
                        <path d="M3 14h7v7H3z"></path>
                    </svg>
                    Compare
                </a>
                <a href="#presets" class="nav-link" data-page="presets">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Presets
                </a>
                <a href="#breakout" class="nav-link" data-page="breakout">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Breakout / Cooldown
                </a>
                <a href="#data-health" class="nav-link" data-page="data-health">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                    Data Health
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="app-content">
        <!-- Dynamic content will be rendered here -->
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="components/kpi-card.js"></script>
    <script src="components/data-table.js"></script>
    <script src="components/filter-chips.js"></script>
    <script src="components/loading.js"></script>
    <script src="pages/query.js"></script>
    <script src="pages/compare.js"></script>
    <script src="pages/presets.js"></script>
    <script src="pages/breakout.js"></script>
    <script src="pages/data-health.js"></script>
    <script src="app.js"></script>
</body>
</html>
